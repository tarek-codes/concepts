name: Daily CS Concept

on:
  schedule:
    - cron: '30 15 * * *'
      timezone: 'Asia/Dhaka'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-concept:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Generate concept using Groq
      # --------------------------------------------------
      - name: Generate new concept with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          GROQ_API_KEY = os.environ.get("GROQ_API_KEY")

          if not GROQ_API_KEY:
              raise RuntimeError(
                  "GROQ_API_KEY GitHub secret is not configured."
              )

          CONCEPTS_FILE = "concepts.md"

          # --------------------------------------------------
          # Preferred models
          #
          # The workflow automatically chooses the first
          # model that is available to the API key.
          # --------------------------------------------------
          PREFERRED_MODELS = [
              "qwen/qwen3.6-27b",
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant",
          ]

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODELS_URL = "https://api.groq.com/openai/v1/models"

          # --------------------------------------------------
          # Helper: authenticated GET request
          # --------------------------------------------------
          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {GROQ_API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "github-actions-daily-cs-concept",
                  },
                  method="GET",
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # --------------------------------------------------
          # Find an available model
          # --------------------------------------------------
          print("Checking available Groq models...")

          try:
              models_response = get_json(MODELS_URL)

              available_models = {
                  model.get("id")
                  for model in models_response.get("data", [])
              }

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")

              print("Could not access Groq model list.")
              print(f"HTTP {e.code}")
              print(body)

              raise RuntimeError(
                  "Groq API authentication/permission failed. "
                  "Check the GROQ_API_KEY GitHub secret."
              )

          print("Available preferred models:")

          selected_model = None

          for model in PREFERRED_MODELS:
              if model in available_models:
                  selected_model = model
                  print(f"  ✓ {model}")
                  break
              else:
                  print(f"  ✗ {model}")

          if not selected_model:
              raise RuntimeError(
                  "None of the configured Groq models are available "
                  "for this API key."
              )

          print()
          print(f"Using Groq model: {selected_model}")

          # --------------------------------------------------
          # Read existing concepts
          # --------------------------------------------------
          if not os.path.exists(CONCEPTS_FILE):
              open(
                  CONCEPTS_FILE,
                  "w",
                  encoding="utf-8"
              ).close()

          with open(
              CONCEPTS_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              existing = f.read()

          # --------------------------------------------------
          # Extract existing headings only
          #
          # This prevents the prompt from growing massively
          # as concepts.md gets larger.
          # --------------------------------------------------
          existing_titles = []

          for line in existing.splitlines():
              stripped = line.strip()

              if stripped.startswith("#"):
                  title = stripped.lstrip("#").strip()

                  if title:
                      existing_titles.append(title)

          existing_titles_text = "\n".join(
              f"- {title}"
              for title in existing_titles
          )

          if not existing_titles_text:
              existing_titles_text = "- No concepts yet."

          print()
          print(
              f"Existing concept headings: "
              f"{len(existing_titles)}"
          )

          # --------------------------------------------------
          # Prompt
          # --------------------------------------------------
          prompt = f"""
          You maintain a personal Computer Science concepts repository.

          Generate EXACTLY ONE new Computer Science concept that is
          NOT already covered by the existing concept titles.

          Requirements:

          1. Generate exactly ONE concept.
          2. Do NOT duplicate an existing concept.
          3. The concept must be useful for Computer Science students
             and software engineers.
          4. Prefer topics from:
             - Data Structures
             - Algorithms
             - Operating Systems
             - Computer Networks
             - Databases
             - Distributed Systems
             - System Design
             - Software Engineering
             - Cybersecurity
             - Artificial Intelligence
             - Machine Learning
             - Programming Languages
             - Computer Architecture
             - Cloud Computing
             - DevOps

          5. Explain the concept clearly and practically.
          6. Keep it concise but informative.
          7. Include a practical example when useful.
          8. The content must be Markdown.
          9. The title should be suitable for an H2 heading.
          10. Do not include an introduction.
          11. Do not include commentary outside the concept.
          12. Return ONLY valid JSON in this exact format:

          {{
            "title": "Concept Title",
            "content": "Markdown explanation of the concept"
          }}

          Existing concepts:

          {existing_titles_text}
          """

          # --------------------------------------------------
          # Groq request
          # --------------------------------------------------
          payload = {
              "model": selected_model,
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are an expert Computer Science educator "
                          "and software engineer. "
                          "Return only valid JSON."
                      ),
                  },
                  {
                      "role": "user",
                      "content": prompt,
                  },
              ],
              "temperature": 0.7,
              "max_completion_tokens": 1500,
              "response_format": {
                  "type": "json_object"
              },
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              API_URL,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {GROQ_API_KEY}",
                  "User-Agent": "github-actions-daily-cs-concept",
              },
              method="POST",
          )

          # --------------------------------------------------
          # API call with retry
          # --------------------------------------------------
          result = None

          for attempt in range(3):

              try:
                  print(
                      f"Calling Groq "
                      f"(attempt {attempt + 1}/3)..."
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  break

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Groq returned HTTP {e.code}:"
                  )
                  print(body)

                  # 403 is a permission problem and retrying
                  # will not fix it.
                  if e.code == 403:
                      raise RuntimeError(
                          "Groq returned HTTP 403. "
                          "The selected model is not permitted "
                          "for this API key/project."
                      )

                  # Retry temporary errors.
                  if e.code in (429, 500, 502, 503, 504):
                      if attempt < 2:
                          wait = 5 * (attempt + 1)

                          print(
                              f"Retrying in {wait} seconds..."
                          )

                          time.sleep(wait)
                          continue

                  raise

              except Exception as e:

                  print(
                      f"Request failed: {type(e).__name__}: {e}"
                  )

                  if attempt < 2:
                      wait = 5 * (attempt + 1)

                      print(
                          f"Retrying in {wait} seconds..."
                      )

                      time.sleep(wait)
                      continue

                  raise

          if result is None:
              raise RuntimeError(
                  "Groq did not return a response."
              )

          # --------------------------------------------------
          # Extract response
          # --------------------------------------------------
          try:
              raw_content = (
                  result["choices"][0]["message"]["content"]
              )

          except (
              KeyError,
              IndexError,
              TypeError
          ):
              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Unexpected Groq API response."
              )

          if not raw_content:
              raise RuntimeError(
                  "Groq returned an empty response."
              )

          # --------------------------------------------------
          # Parse JSON
          # --------------------------------------------------
          try:
              generated = json.loads(
                  raw_content
              )

          except json.JSONDecodeError:
              print("Groq returned invalid JSON:")
              print(raw_content)

              raise RuntimeError(
                  "Could not parse Groq response as JSON."
              )

          title = str(
              generated.get("title", "")
          ).strip()

          content = str(
              generated.get("content", "")
          ).strip()

          if not title:
              raise RuntimeError(
                  "Generated concept has no title."
              )

          if not content:
              raise RuntimeError(
                  "Generated concept has no content."
              )

          # --------------------------------------------------
          # Duplicate protection
          # --------------------------------------------------
          existing_lower = {
              title.strip().lower()
              for title in existing_titles
          }

          if title.lower() in existing_lower:
              raise RuntimeError(
                  f"Duplicate concept generated: {title}"
              )

          # --------------------------------------------------
          # Build Markdown
          # --------------------------------------------------
          concept = (
              f"## {title}\n\n"
              f"{content}\n"
          )

          # --------------------------------------------------
          # Append concept
          # --------------------------------------------------
          with open(
              CONCEPTS_FILE,
              "a",
              encoding="utf-8"
          ) as f:

              f.write("\n\n---\n\n")
              f.write(concept)

          print()
          print("========================================")
          print("Generated CS Concept")
          print("========================================")
          print(concept)
          print("========================================")
          print()
          print(
              f"Model used: {selected_model}"
          )

          PY

      # --------------------------------------------------
      # 3. Commit generated concept
      # --------------------------------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add concepts.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "docs: add daily CS concept"

          git push
