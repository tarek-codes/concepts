name: Daily CS Concept

on:
  schedule:
    - cron: '30 15 * * *'
      timezone: 'Asia/Dhaka'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-concept:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Generate concept using Groq
      # --------------------------------------------------
      - name: Generate new concept with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python <<'PY'
          import os
          import re
          import json
          import time
          import urllib.request
          import urllib.error

          GROQ_API_KEY = os.environ.get("GROQ_API_KEY")

          if not GROQ_API_KEY:
              raise RuntimeError(
                  "GROQ_API_KEY GitHub secret is not configured."
              )

          CONCEPTS_FILE = "concepts.md"

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODELS_URL = "https://api.groq.com/openai/v1/models"

          # Preferred models.
          # The workflow automatically selects the first available one.
          PREFERRED_MODELS = [
              "qwen/qwen3.6-27b",
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant",
          ]

          # --------------------------------------------------
          # Helper: GET JSON
          # --------------------------------------------------
          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {GROQ_API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "github-actions-daily-cs-concept",
                  },
                  method="GET",
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # --------------------------------------------------
          # Find available Groq model
          # --------------------------------------------------
          print("Checking available Groq models...")

          try:
              models_response = get_json(MODELS_URL)

              available_models = {
                  model.get("id")
                  for model in models_response.get("data", [])
              }

          except urllib.error.HTTPError as e:
              body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("Could not access Groq model list.")
              print(f"HTTP {e.code}")
              print(body)

              raise RuntimeError(
                  "Groq API authentication failed. "
                  "Check GROQ_API_KEY."
              )

          print("Available preferred models:")

          selected_model = None

          for model in PREFERRED_MODELS:
              if model in available_models:
                  print(f"  ✓ {model}")

                  selected_model = model
                  break

              print(f"  ✗ {model}")

          if not selected_model:
              raise RuntimeError(
                  "None of the configured Groq models "
                  "are available."
              )

          print()
          print(f"Using Groq model: {selected_model}")

          # --------------------------------------------------
          # Read concepts.md
          # --------------------------------------------------
          if not os.path.exists(CONCEPTS_FILE):
              with open(
                  CONCEPTS_FILE,
                  "w",
                  encoding="utf-8"
              ):
                  pass

          with open(
              CONCEPTS_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              existing = f.read()

          # --------------------------------------------------
          # Extract existing headings
          # --------------------------------------------------
          existing_titles = []

          for line in existing.splitlines():

              stripped = line.strip()

              if stripped.startswith("#"):

                  title = stripped.lstrip("#").strip()

                  if title:
                      existing_titles.append(title)

          if existing_titles:

              existing_titles_text = "\n".join(
                  f"- {title}"
                  for title in existing_titles
              )

          else:

              existing_titles_text = "- No concepts yet."

          print(
              f"Existing concept headings: "
              f"{len(existing_titles)}"
          )

          # --------------------------------------------------
          # Prompt
          # --------------------------------------------------
          prompt = f"""
          You maintain a personal Computer Science concepts repository.

          Generate EXACTLY ONE new Computer Science concept.

          The concept MUST NOT duplicate any concept in the existing
          concept list below.

          Preferred areas:

          - Data Structures
          - Algorithms
          - Operating Systems
          - Computer Networks
          - Databases
          - Distributed Systems
          - System Design
          - Software Engineering
          - Cybersecurity
          - Artificial Intelligence
          - Machine Learning
          - Programming Languages
          - Computer Architecture
          - Cloud Computing
          - DevOps

          Requirements:

          1. Generate exactly ONE concept.
          2. Do not duplicate an existing concept.
          3. Make it useful for a Computer Science student
             and software engineer.
          4. Explain it clearly and practically.
          5. Keep the explanation concise but informative.
          6. Include a practical example when appropriate.
          7. The content must use Markdown.
          8. Do not include an introduction.
          9. Do not include commentary outside the concept.
          10. Do not use code fences around the entire response.

          IMPORTANT OUTPUT FORMAT:

          Return ONLY the following format:

          TITLE: Concept Title

          CONTENT:
          Markdown explanation of the concept.

          Do not add anything before TITLE.
          Do not add anything after the CONTENT.

          Existing concepts:
          ==================

          {existing_titles_text}
          """

          # --------------------------------------------------
          # API payload
          #
          # IMPORTANT:
          # No response_format/json_object here.
          #
          # This avoids the JSON validation problem with
          # Qwen reasoning mode.
          # --------------------------------------------------
          payload = {
              "model": selected_model,

              "messages": [
                  {
                      "role": "user",
                      "content": prompt,
                  }
              ],

              "temperature": 0.7,

              "max_completion_tokens": 1800,

              # Qwen 3.6 supports disabling reasoning.
              # This makes the response cleaner and faster.
              "reasoning_effort": "none",

              "stream": False,
          }

          data = json.dumps(payload).encode("utf-8")

          # --------------------------------------------------
          # API request
          # --------------------------------------------------
          request = urllib.request.Request(
              API_URL,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {GROQ_API_KEY}",
                  "User-Agent": "github-actions-daily-cs-concept",
              },
              method="POST",
          )

          result = None

          # --------------------------------------------------
          # Retry temporary failures
          # --------------------------------------------------
          for attempt in range(3):

              try:

                  print(
                      f"Calling Groq "
                      f"(attempt {attempt + 1}/3)..."
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  break

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Groq returned HTTP {e.code}:"
                  )
                  print(body)

                  # Don't retry permission/auth errors.
                  if e.code in (400, 401, 403):

                      raise RuntimeError(
                          f"Groq request failed with HTTP "
                          f"{e.code}."
                      )

                  # Retry rate limits and temporary server errors.
                  if e.code in (
                      429,
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt < 2:

                          wait = 5 * (attempt + 1)

                          print(
                              f"Retrying in "
                              f"{wait} seconds..."
                          )

                          time.sleep(wait)
                          continue

                  raise

              except Exception as e:

                  print(
                      f"Request failed: "
                      f"{type(e).__name__}: {e}"
                  )

                  if attempt < 2:

                      wait = 5 * (attempt + 1)

                      print(
                          f"Retrying in "
                          f"{wait} seconds..."
                      )

                      time.sleep(wait)
                      continue

                  raise

          if result is None:

              raise RuntimeError(
                  "Groq did not return a response."
              )

          # --------------------------------------------------
          # Extract response text
          # --------------------------------------------------
          try:

              response_text = (
                  result["choices"][0]
                  ["message"]
                  ["content"]
                  .strip()
              )

          except (
              KeyError,
              IndexError,
              TypeError
          ):

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              raise RuntimeError(
                  "Unexpected Groq API response."
              )

          if not response_text:

              raise RuntimeError(
                  "Groq returned an empty response."
              )

          print()
          print("Raw Groq response:")
          print(response_text)
          print()

          # --------------------------------------------------
          # Extract TITLE
          # --------------------------------------------------
          title_match = re.search(
              r"(?im)^TITLE:\s*(.+?)\s*$",
              response_text
          )

          if not title_match:

              raise RuntimeError(
                  "Could not find TITLE in Groq response."
              )

          title = title_match.group(1).strip()

          # --------------------------------------------------
          # Extract CONTENT
          # --------------------------------------------------
          content_match = re.search(
              r"(?is)^CONTENT:\s*(.+?)\s*$",
              response_text
          )

          if not content_match:

              raise RuntimeError(
                  "Could not find CONTENT in Groq response."
              )

          content = content_match.group(1).strip()

          # --------------------------------------------------
          # Clean accidental heading
          # --------------------------------------------------
          title = re.sub(
              r"^#+\s*",
              "",
              title
          ).strip()

          # --------------------------------------------------
          # Validate
          # --------------------------------------------------
          if not title:

              raise RuntimeError(
                  "Generated title is empty."
              )

          if not content:

              raise RuntimeError(
                  "Generated content is empty."
              )

          # --------------------------------------------------
          # Duplicate protection
          # --------------------------------------------------
          existing_lower = {
              title.strip().lower()
              for title in existing_titles
          }

          if title.lower() in existing_lower:

              raise RuntimeError(
                  f"Duplicate concept generated: {title}"
              )

          # --------------------------------------------------
          # Build Markdown
          # --------------------------------------------------
          concept = (
              f"## {title}\n\n"
              f"{content}\n"
          )

          # --------------------------------------------------
          # Append to concepts.md
          # --------------------------------------------------
          with open(
              CONCEPTS_FILE,
              "a",
              encoding="utf-8"
          ) as f:

              f.write("\n\n---\n\n")
              f.write(concept)

          print("========================================")
          print("Generated CS Concept")
          print("========================================")
          print(concept)
          print("========================================")
          print()
          print(f"Model used: {selected_model}")

          PY

      # --------------------------------------------------
      # 3. Commit changes
      # --------------------------------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add concepts.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "docs: add daily CS concept"

          git push
